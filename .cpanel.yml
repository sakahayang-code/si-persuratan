---
deployment:
  tasks:
    - export DEPLOYPATH=/home/mulw1713/public_html/persuratan
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/database $DEPLOYPATH/storage
    - /bin/cp -R * $DEPLOYPATH/
    - /bin/cp -f .htaccess $DEPLOYPATH/
    - test -f public/.htaccess && /bin/cp -f public/.htaccess $DEPLOYPATH/public/ || true
    - /bin/chmod -R 755 $DEPLOYPATH 2>/dev/null || true
    - /bin/chmod 644 $DEPLOYPATH/index.html $DEPLOYPATH/.htaccess 2>/dev/null || true
    - /bin/chmod -R 775 $DEPLOYPATH/storage $DEPLOYPATH/database 2>/dev/null || true